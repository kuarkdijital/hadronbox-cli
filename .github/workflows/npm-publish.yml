# Publishes hadronbox to npm when a v* tag is pushed. Two jobs:
#
#   build   — no id-token, no environment: checks the tag, installs the dev dependencies, typechecks, tests, builds,
#             checks the package contents and packs one .tgz. Its sha256 becomes a job output; the .tgz an artifact.
#   publish — the only job that can request an OIDC token (id-token: write), gated by the npm-publish environment
#             (reviewer approval). It runs no project code and installs nothing: it downloads the .tgz, verifies the
#             sha256 and, independently of the build job, the package contents (exact file list, no install-time
#             scripts, no dependencies, bin, name/version), then runs `npm publish <tgz> --ignore-scripts`.
#
# A compromised dev dependency can only influence the build job, which cannot obtain an npm credential. It could
# still try to change what goes into the package; the publish job's content check (tar + node -e, no repository
# code) rejects any tarball that is not exactly the expected six files with a clean package.json.
#
# Auth: npm Trusted Publishing (OIDC). No npm token and no other secret exists for this workflow. npm checks the
# OIDC token against the trusted publisher configured on npmjs.com for the package:
#   owner kuarkdijital, repository hadronbox-cli, workflow npm-publish.yml, environment npm-publish.
# Requirements (docs.npmjs.com/trusted-publishers): npm CLI >= 11.5.1 and Node >= 22.14.0 in the publish job,
# GitHub-hosted runner, package.json repository.url equal to this repository. Node versions are pinned exactly:
# build 22.23.5, publish 24.22.3 (bundles npm 11.19.1; npm >= 11.5.1 ships with Node >= 24.5.0), so the publish job
# installs nothing and only checks both versions. Bump them deliberately (nodejs.org/dist/index.json lists npm per Node).
# Provenance: generated by trusted publishing from a public repository (--provenance and publishConfig.provenance
# state it explicitly).
name: npm-publish

on:
  push:
    tags: ['v*']

# No id-token here: only the publish job gets it.
permissions:
  contents: read

# One release at a time. A newer tag waiting for approval replaces an older one that is still waiting (GitHub keeps
# at most one pending run per group); a running publish is never cancelled.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      dist_tag: ${{ steps.meta.outputs.dist_tag }}
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # No dependency cache in the release workflow (cache poisoning); npm ci installs from package-lock.json.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.5
      - name: Tag, version, branch and dist-tag
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          NAME="$(node -p 'require("./package.json").name')"
          if [ "$NAME" != "hadronbox" ]; then
            echo "::error::package.json name is '$NAME', expected 'hadronbox'"; exit 1
          fi
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag '$TAG' does not match package.json version '$VERSION' (expected tag 'v$VERSION')"; exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag '$TAG' ($GITHUB_SHA) is not on main"; exit 1
          fi
          # Prints the version if it exists; empty (or E404) otherwise.
          if [ -n "$(npm view "hadronbox@$VERSION" version 2>/dev/null)" ]; then
            echo "::error::hadronbox@$VERSION is already on npm"; exit 1
          fi
          # Pre-release → next. Stable → latest, unless it is lower than the current latest (a backport): then
          # "backport", so latest never moves backwards.
          LATEST="$(npm view hadronbox dist-tags.latest 2>/dev/null || true)"
          DIST_TAG="$(VERSION="$VERSION" LATEST="$LATEST" node -e '
            const { VERSION: v, LATEST: latest } = process.env;
            if (v.includes("-")) { console.log("next"); process.exit(0); }
            const core = (s) => s.split("-")[0].split(".").map(Number);
            const cmp = (a, b) => { for (let i = 0; i < 3; i++) if (a[i] !== b[i]) return a[i] - b[i]; return 0; };
            console.log(latest && cmp(core(v), core(latest)) < 0 ? "backport" : "latest");
          ')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "hadronbox@$VERSION → dist-tag $DIST_TAG (current latest: ${LATEST:-none})"
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Package contents (npm pack --dry-run)
        run: npm run check:pack
      - name: Pack
        id: pack
        run: |
          mkdir -p release
          # --ignore-scripts: dist/ is the build checked above; prepack must not rebuild it.
          TARBALL="$(npm pack --ignore-scripts --pack-destination release --json | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename)')"
          SHA256="$(sha256sum "release/$TARBALL" | cut -d' ' -f1)"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "$TARBALL sha256 $SHA256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: release/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
      - name: Check toolchain versions (Trusted Publishing needs npm >= 11.5.1, Node >= 22.14.0)
        run: |
          node -e '
            const need = { node: [22, 14, 0], npm: [11, 5, 1] };
            const have = {
              node: process.versions.node,
              npm: require("node:child_process").execSync("npm --version", { encoding: "utf8" }).trim(),
            };
            for (const [tool, min] of Object.entries(need)) {
              const v = have[tool].split(".").map(Number);
              const ok = v[0] !== min[0] ? v[0] > min[0] : v[1] !== min[1] ? v[1] > min[1] : v[2] >= min[2];
              console.log(`${tool} ${have[tool]} (need >= ${min.join(".")})`);
              if (!ok) process.exit(1);
            }
          '
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: release
      - name: Verify the package
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          SHA256: ${{ needs.build.outputs.sha256 }}
          VERSION: ${{ needs.build.outputs.version }}
        # Independent of the build job: only tar and an inline node script, no repository code.
        run: |
          case "$TARBALL" in hadronbox-*.tgz) ;; *) echo "::error::unexpected tarball name '$TARBALL'"; exit 1 ;; esac
          [ "$(ls release | wc -l)" -eq 1 ] || { echo "::error::expected exactly one file in the artifact"; exit 1; }
          echo "$SHA256  release/$TARBALL" | sha256sum --check --strict
          node -e '
            const { execFileSync } = require("node:child_process");
            const file = process.argv[1];
            const fail = (message) => { console.error("::error::" + message); process.exit(1); };
            const tar = (args) => execFileSync("tar", args, { encoding: "utf8", maxBuffer: 64 * 1024 * 1024 });
            const expected = ["package/CHANGELOG.md", "package/LICENSE", "package/README.md",
              "package/dist/cli.js", "package/dist/hadronbox.js", "package/package.json"];
            const names = tar(["-tzf", file]).split("\n").filter(Boolean).sort();
            if (JSON.stringify(names) !== JSON.stringify(expected)) {
              fail("tarball files are [" + names.join(", ") + "], expected exactly [" + expected.join(", ") + "]");
            }
            const types = tar(["-tvzf", file]).split("\n").filter(Boolean).map((line) => line[0]);
            if (types.some((type) => type !== "-")) fail("tarball has entries that are not regular files");
            const pkg = JSON.parse(tar(["-xzOf", file, "package/package.json"]));
            if (pkg.name !== "hadronbox" || pkg.version !== process.env.VERSION) {
              fail("tarball is " + pkg.name + "@" + pkg.version + ", expected hadronbox@" + process.env.VERSION);
            }
            const lifecycle = ["preinstall", "install", "postinstall", "prepare", "preprepare", "postprepare",
              "preuninstall", "uninstall", "postuninstall"];
            const scripts = Object.keys(pkg.scripts || {}).filter((name) => lifecycle.includes(name));
            if (scripts.length > 0) fail("install-time scripts in package.json: " + scripts.join(", "));
            for (const field of ["dependencies", "optionalDependencies", "peerDependencies", "bundleDependencies",
              "bundledDependencies"]) {
              const value = pkg[field];
              const empty = value === undefined || (Array.isArray(value) ? value.length === 0
                : value !== null && typeof value === "object" && Object.keys(value).length === 0);
              if (!empty) fail(field + " must be empty");
            }
            if (pkg.gypfile) fail("gypfile must not be set");
            const bin = pkg.bin || {};
            if (Object.keys(bin).sort().join(",") !== "hadronbox,hb" || bin.hadronbox !== "dist/cli.js" || bin.hb !== "dist/cli.js") {
              fail("bin must be exactly { hadronbox, hb } -> dist/cli.js, got " + JSON.stringify(pkg.bin));
            }
            console.log("verified " + pkg.name + "@" + pkg.version + ": " + names.length + " files, no install scripts, no dependencies");
          ' "release/$TARBALL"
      - name: Publish (Trusted Publishing + provenance)
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
        run: npm publish "./release/$TARBALL" --provenance --access public --tag "$DIST_TAG" --ignore-scripts
